name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          echo "${{ secrets.KEYSTORE_PASSWORD }}" > keystore.password
          echo "${{ secrets.KEY_ALIAS }}" > keystore.alias
          echo "${{ secrets.KEY_ALIAS_PASSWORD }}" > keystore.alias.password

      - name: Build release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon
          ls -la app/build/outputs/apk/release/

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/jarvis.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: out/jarvis.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="jarvis-build-$(date +%Y%m%d-%H%M)"
          cp app/build/outputs/apk/release/app-release.apk out/jarvis.apk
          gh release create "$TAG" out/jarvis.apk \
            --title "Jarvis APK $(date +%Y%m%d)" \
            --notes "Auto-built signed release APK (Gemini 3.5 flash)" \
            --prerelease